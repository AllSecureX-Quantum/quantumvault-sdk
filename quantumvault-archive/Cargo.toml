[package]
name = "quantumvault-archive"
description = "Long-term integrity sealing with SLH-DSA (FIPS 205) — Hop 6.6 Archive Sealer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
quantumvault-core = { path = "../quantumvault-core" }

# Hashing
sha3.workspace = true

# Filesystem traversal
walkdir = "2.5"

# Serde + JSON
serde.workspace = true
serde_json.workspace = true

# Base64 for keys + signatures in the manifest
base64.workspace = true

# Times
chrono.workspace = true

# Errors
thiserror.workspace = true

# CLI (for the qvarchive binary)
clap.workspace = true
anyhow.workspace = true

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"

[[bin]]
name = "qvarchive"
path = "src/bin/qvarchive.rs"
