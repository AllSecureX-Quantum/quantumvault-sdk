[workspace]
resolver = "2"
members = [
    # Required dependency crates
    "quantumvault-core",
    "quantumvault-keys",
    "quantumvault-jose",
    # Public CLI binaries
    "quantumvault-cli",
    "quantumvault-ca",
    "quantumvault-dnssec",
    "quantumvault-acme",
    "quantumvault-jwtproxy",
    "quantumvault-smime",
    "quantumvault-archive",
    "quantumvault-pkcs11",
    "quantum-scanner-cli",
]

[workspace.package]
version = "1.0.10"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
authors = ["AllSecureX <security@allsecurex.com>"]
repository = "https://github.com/allsecurex/allsecurex-quantum-vault"
homepage = "https://allsecurex.com/quantum-vault"
documentation = "https://docs.allsecurex.com/quantum-vault"
keywords = ["cryptography", "post-quantum", "pqc", "security", "aws", "allsecurex"]
categories = ["cryptography", "api-bindings"]

[workspace.dependencies]
# Post-Quantum Cryptography
pqcrypto = "0.17"
pqcrypto-traits = "0.3"
pqcrypto-kyber = "0.8"
pqcrypto-dilithium = "0.5"
pqcrypto-sphincsplus = "0.7"

# Classical Cryptography
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
hkdf = "0.12"
pbkdf2 = "0.12"
hmac = "0.12"
rsa = "0.9"
ecdsa = "0.16"
p256 = "0.13"
p384 = "0.13"
x25519-dalek = "2"
ed25519-dalek = "2"

# Randomness & Security
rand = "0.8"
rand_core = "0.6"
getrandom = { version = "0.2", features = ["std"] }
zeroize = { version = "1.7", features = ["derive"] }
secrecy = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
base64 = "0.22"
hex = "0.4"
bincode = "1.3"

# Async Runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# AWS SDK - pinned to versions compatible with Rust 1.87
aws-config = "=1.5.4"
aws-sdk-dynamodb = "=1.38.0"
aws-sdk-kms = "=1.37.0"
aws-sdk-secretsmanager = "=1.37.0"
aws-sdk-sts = "=1.37.0"

# HTTP & Networking
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
hyper = { version = "1.0", features = ["full"] }
axum = { version = "0.7", features = ["macros", "json"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = { version = "0.4", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.5", features = ["cors", "trace", "request-id", "compression-gzip"] }

# Validation & Rate Limiting
validator = { version = "0.16", features = ["derive"] }
governor = "0.6"
subtle = "2.5"
dotenvy = "0.15"
config = "0.14"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.21"
opentelemetry-otlp = "0.14"
metrics = "0.22"
metrics-exporter-prometheus = "0.13"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }
dialoguer = "0.11"
indicatif = "0.17"
console = "0.15"
colored = "2.1"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
url = "2.5"
bytes = "1.5"
parking_lot = "0.12"
once_cell = "1.19"
dashmap = "5.5"
semver = "1.0"
regex = "1.10"

# Testing
criterion = "0.5"
proptest = "1.4"
test-case = "3.3"
wiremock = "0.5"
mockall = "0.12"
tempfile = "3.10"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.dev]
opt-level = 1

[profile.bench]
lto = true
codegen-units = 1
