[package]
name = "quantum-scanner"
version = "1.1.0"
edition = "2021"
authors = ["AllSecureX <engineering@allsecurex.com>"]
description = "Quantum Scanner CLI - Post-quantum cryptography vulnerability assessment tool"
license = "Proprietary"
homepage = "https://allsecurex.com"
repository = "https://github.com/allsecurex/quantum-scanner"
keywords = ["cryptography", "security", "quantum", "post-quantum", "scanner"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI framework
clap = { version = "4.4", features = ["derive", "env", "color"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Terminal UI
ratatui = "0.26"
crossterm = "0.27"

# Colors and styling
colored = "2.1"
console = "0.15"
indicatif = "0.17"

# File walking
walkdir = "2.4"
ignore = "0.4"
glob = "0.3"

# Regex for pattern matching
regex = "1.10"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.6", features = ["v4"] }

# Environment and config
dirs = "5.0"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Encoding
base64 = "0.21"

# System info
num_cpus = "1.16"

# Lazy initialization
once_cell = "1.19"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "quantum-scanner"
path = "src/main.rs"
