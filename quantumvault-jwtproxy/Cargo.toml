[package]
name = "quantumvault-jwtproxy"
description = "Envoy-style reverse proxy that verifies post-quantum JWTs (ML-DSA) before forwarding"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
quantumvault-core = { path = "../quantumvault-core" }
quantumvault-jose = { path = "../quantumvault-jose" }

# HTTP server / client
axum = { workspace = true }
tower = { workspace = true }
hyper = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Serde + JSON for the verifying-key file format
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }

# Errors
thiserror = { workspace = true }
anyhow = { workspace = true }

# CLI
clap = { workspace = true }

# Headers
http = "1.0"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
chrono = { workspace = true }

[[bin]]
name = "qvjwtproxy"
path = "src/bin/qvjwtproxy.rs"
