# CI: Build and test the public Rust workspace.
#
# Budget posture (GitHub Free plan, 2000 min/month):
#   - Linux only on push/PR. macOS (10× cost) and Windows (2×) run only
#     on tags via release.yml.
#   - One consolidated Rust test job instead of one-per-crate.
#   - paths-ignore on docs / README so doc-only commits don't burn CI.
#   - concurrency: cancel-in-progress so rapid sequential pushes don't
#     accumulate queued runs.

name: test

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust workspace · build + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-build

      - name: cargo build --workspace
        run: cargo build --workspace --all-features

      - name: cargo test --workspace
        run: cargo test --workspace --all-features
